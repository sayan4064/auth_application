server:
  port: 8083

spring:
  datasource:
    url: jdbc:mysql://localhost:3309/auth_application
    username: root
    password: ${MYSQL_ROOT_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope:
              - user:email
              - read:user
#    hikari:
#      pool-name: HikariCP
#      maximum-pool-size: 5
#      connection-timeout: 30000
#      idle-timeout: 600000
#      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

    show-sql: true

security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:api.substring.com}

      access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:180}
      refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:604800}

      refresh-token-cookie-name: ${JWT_COOKIE_NAME:refreshToken}

      cookie-secure: ${JWT_COOKIE_SECURE:false}
      cookie-http-only: ${JWT_COOKIE_HTTP_ONLY:true}
      cookie-same-site: ${JWT_COOKIE_SAME_SITE:lax}

      cookie-domain: ${JWT_COOKIE_DOMAIN:localhost}