server:
  port: 8083

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/auth_app_qa
    username: root
    password: root1234
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      pool-name: AuthAppQA-HikariPool
      maximum-pool-size: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

    show-sql: false